{% if frappe.session.user == 'Guest' %}

    <h2>My Shifts</h2>
    <p>Sign in to view your schedule.</p>
    <p><a class="mgr-btn primary" href="/login?redirect-to=/manage-shifts">Log in</a></p>

{% else %}

{% endif %}
